services:
  postgres:
    image: postgres:17
    container_name: manifesto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manifesto_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["manifesto_data:/var/lib/postgresql/data"]
volumes:
  manifesto_data:
